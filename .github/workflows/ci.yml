name: CI

# Runs on every branch and pull request. Nothing is published here: the tag-driven
# release workflow does that, and it repeats the tests before it publishes.

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build, test and dry-run the package
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check what would be published
        run: npm pack --dry-run
