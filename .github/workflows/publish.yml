name: Publish

# Publishes the package to npm, which is how n8n community nodes are distributed.
# Every job builds first, so a broken build cannot reach the registry.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build, test and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the tests
        run: npm test

      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION="$(node -p "require('./package.json').version")"

          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match the package version $VERSION"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Publish to npm
        # Only a version tag publishes; a manual run stops after the checks.
        if: startsWith(github.ref, 'refs/tags/')
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
